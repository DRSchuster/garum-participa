<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GARUM</title>
  <script>
    /* Cada sitio es la carpeta s/<ID>/. Los estilos y los datos salen de la raíz. */
    (function () {
      var partes = location.pathname.split("/");
      var i = partes.indexOf("s");
      var base = (i >= 0 ? partes.slice(0, i) : partes.slice(0, -1)).join("/");
      if (!base.endsWith("/")) base += "/";
      var el = document.createElement("base");
      el.href = location.origin + base;
      document.head.appendChild(el);
    })();
  </script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <div class="idiomas">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <h1>GARUM</h1>
    <p class="sitio" id="nombre"></p>
    <p class="proyecto" id="proyecto"></p>
    <div class="pestanas">
      <button type="button" id="tab-enviar" class="activo"></button>
      <button type="button" id="tab-ayuda"></button>
    </div>
    <section id="panel-enviar">
      <form id="formulario" action="#" onsubmit="return false;">
        <input id="foto" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp,image/tiff,.dng,.jpg,.jpeg,.png,.heic,.heif,.webp,.tif,.tiff" multiple>
        <label class="grande" id="elegir" for="foto"></label>
        <div id="miniaturas"></div>
        <label id="etiqueta-nota" for="nota"></label>
        <textarea id="nota" maxlength="500" rows="2"></textarea>
        <label class="casilla">
          <input id="casilla" type="checkbox">
          <span id="casilla-texto"></span>
        </label>
        <button type="button" id="mas" class="enlace"></button>
        <button id="mandar" class="grande" type="button"></button>
        <div id="progreso" hidden><span id="avance"></span></div>
      </form>
    </section>
    <section id="panel-ayuda" hidden>
      <h2 id="tit-foto"></h2>
      <p id="instrucciones"></p>
      <h2 id="tit-seg"></h2>
      <p id="seguridad"></p>
      <h2 id="tit-lic"></h2>
      <p id="licencia"></p>
      <h2 id="tit-datos"></h2>
      <p id="rgpd"></p>
    </section>
    <p id="estado"></p>
    <p class="pie" id="pie"></p>
  </main>
  <script src="config.js"></script>
  <script src="exif.js"></script>
  <script src="app.js"></script>
</body>
</html>
